<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620">
  <rect width="1400" height="620" fill="#f3f4f6"/>
  <text x="54" y="70" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="34" font-weight="700" fill="#111827">问题二：启动脚本重复重建数据库</text>
  <rect x="54" y="105" width="1292" height="455" rx="16" fill="#111827"/>
  <rect x="54" y="105" width="1292" height="46" rx="16" fill="#1f2937"/>
  <circle cx="84" cy="128" r="8" fill="#ef4444"/>
  <circle cx="108" cy="128" r="8" fill="#f59e0b"/>
  <circle cx="132" cy="128" r="8" fill="#10b981"/>
  <text x="160" y="136" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#cbd5e1">排查记录</text>
  <text x="88" y="195" font-family="Menlo, Consolas, monospace" font-size="20" fill="#e5e7eb">修复前流程：</text>
  <text x="88" y="232" font-family="Menlo, Consolas, monospace" font-size="20" fill="#e5e7eb">run_windows.bat -&gt; python scripts\init_db.py</text>
  <text x="88" y="269" font-family="Menlo, Consolas, monospace" font-size="20" fill="#e5e7eb">脚本直接调用 init_db(seed=True)</text>
  <text x="88" y="306" font-family="Menlo, Consolas, monospace" font-size="20" fill="#e5e7eb">schema.sql 中包含重建语句：</text>
  <text x="88" y="348" font-family="Menlo, Consolas, monospace" font-size="20" fill="#fca5a5">DROP TABLE IF EXISTS submissions;</text>
  <text x="88" y="388" font-family="Menlo, Consolas, monospace" font-size="20" fill="#fca5a5">DROP TABLE IF EXISTS assignments;</text>
  <text x="88" y="428" font-family="Menlo, Consolas, monospace" font-size="20" fill="#fca5a5">DROP TABLE IF EXISTS enrollments;</text>
  <text x="88" y="494" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" fill="#d1d5db">风险现象：第二次启动系统时，提交记录和评分记录会被清空。</text>
  <text x="88" y="531" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" fill="#d1d5db">修复方法：新增 ensure_db，默认只在缺少 users 表时建库。</text>
</svg>
