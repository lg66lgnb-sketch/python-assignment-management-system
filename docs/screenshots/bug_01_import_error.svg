<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620">
  <rect width="1400" height="620" fill="#f3f4f6"/>
  <text x="54" y="70" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="34" font-weight="700" fill="#111827">问题一：初始化脚本导入失败</text>
  <rect x="54" y="105" width="1292" height="455" rx="16" fill="#111827"/>
  <rect x="54" y="105" width="1292" height="46" rx="16" fill="#1f2937"/>
  <circle cx="84" cy="128" r="8" fill="#ef4444"/>
  <circle cx="108" cy="128" r="8" fill="#f59e0b"/>
  <circle cx="132" cy="128" r="8" fill="#10b981"/>
  <text x="160" y="136" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#cbd5e1">调试记录</text>
  <text x="88" y="195" font-family="Menlo, Consolas, monospace" font-size="20" fill="#e5e7eb">$ .venv/bin/python scripts/init_db.py</text>
  <text x="88" y="232" font-family="Menlo, Consolas, monospace" font-size="20" fill="#e5e7eb">Traceback (most recent call last):</text>
  <text x="88" y="269" font-family="Menlo, Consolas, monospace" font-size="20" fill="#e5e7eb">  File ".../scripts/init_db.py", line 1, in &lt;module&gt;</text>
  <text x="88" y="306" font-family="Menlo, Consolas, monospace" font-size="20" fill="#e5e7eb">    from assignment_system import create_app</text>
  <text x="88" y="343" font-family="Menlo, Consolas, monospace" font-size="20" fill="#fca5a5">ModuleNotFoundError:</text>
  <text x="88" y="380" font-family="Menlo, Consolas, monospace" font-size="20" fill="#fca5a5">No module named 'assignment_system'</text>
  <text x="88" y="444" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" fill="#d1d5db">排查结论：脚本入口目录是 scripts，项目根目录没有进入 sys.path。</text>
  <text x="88" y="481" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" fill="#d1d5db">修复方法：在脚本开头加入项目根目录，再导入 assignment_system。</text>
</svg>
